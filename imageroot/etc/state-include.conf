#
# Restic include patterns for the CS2 module backup (paths relative to /srv).
# The game files (~67 GB, re-downloaded by SteamCMD at any time) are NOT
# backed up: only the module settings, the server cfg directory (game mode
# overrides, custom configs) and the pre/post hooks.
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
state/environment
state/cs2.env
state/cs2-extra.env
volumes/cs2-data/game/csgo/cfg
volumes/cs2-data/pre.sh
volumes/cs2-data/post.sh
